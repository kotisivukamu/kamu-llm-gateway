name: Release

# Mirrors kamuid's release.yml. Publishing a GitHub release (e.g. v0.1.0)
# builds every service, migrates the prod database as the postgres owner,
# deploys, then health-checks. Migrate runs after the images exist but BEFORE
# the rollout, so new code never meets an old schema. Everything pushes to the
# Fly registry.
on:
  release:
    types: [published]
  workflow_dispatch: {}

concurrency:
  group: release-prod
  cancel-in-progress: false

env:
  TAG: ${{ github.event.release.tag_name || github.sha }}

jobs:
  build:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # repo = Fly registry namespace to push to; label prefixes the tag.
        # The migrate image rides in kamu-llm-gateway-api's namespace.
        include:
          - { service: api, repo: registry.fly.io/kamu-llm-gateway-api, label: "" }
          - { service: proxy, repo: registry.fly.io/kamu-llm-gateway-proxy, label: "" }
          - { service: admin, repo: registry.fly.io/llm-proxy-admin, label: "" }
          - { service: database, repo: registry.fly.io/kamu-llm-gateway-api, label: "migrate-" }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: registry.fly.io
          username: x
          password: ${{ secrets.FLY_API_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ format('{0}/Dockerfile', matrix.service) }}
          push: true
          build-args: VERSION=${{ env.TAG }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          tags: ${{ matrix.repo }}:${{ matrix.label }}${{ env.TAG }}

  migrate:
    name: Migrate prod database
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: docker/login-action@v3
        with:
          registry: registry.fly.io
          username: x
          password: ${{ secrets.FLY_API_TOKEN }}

      # The repo secret DATABASE_URL is the `postgres` owner connection, so
      # every object is owned by postgres. No `sslrootcert=system` in it:
      # postgres.js forwards unknown URL params to the server as settings and
      # the connection fails; `sslmode=verify-full` alone uses the system CAs.
      # Running migrate in the runner gives a real exit code: a failed
      # migration fails the release here, before any deploy.
      - name: Apply migrations
        run: |
          docker run --rm \
            -e DATABASE_URL="${{ secrets.DATABASE_URL }}" \
            -e MIGRATE_ROLE=postgres \
            registry.fly.io/kamu-llm-gateway-api:migrate-${{ env.TAG }}

  deploy:
    name: Deploy ${{ matrix.app }}
    runs-on: ubuntu-latest
    needs: [build, migrate]
    strategy:
      matrix:
        include:
          - { app: kamu-llm-gateway-api, config: api/fly.toml }
          - { app: kamu-llm-gateway-proxy, config: proxy/fly.toml }
          - { app: llm-proxy-admin, config: admin/fly.toml }
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy -i registry.fly.io/${{ matrix.app }}:${{ env.TAG }} --config ${{ matrix.config }} --app ${{ matrix.app }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  health-check:
    name: Health check
    runs-on: ubuntu-latest
    needs: [deploy]
    strategy:
      matrix:
        app: [kamu-llm-gateway-api, kamu-llm-gateway-proxy, llm-proxy-admin]
    steps:
      - run: |
          for attempt in 1 2 3 4 5; do
            response=$(curl -sf --max-time 10 https://${{ matrix.app }}.fly.dev/health) && break
            echo "Attempt $attempt failed, retrying in 10s..."; sleep 10
          done
          echo "${{ matrix.app }}: $response"
          echo "$response" | grep -q '"ok":true' || { echo "health check failed"; exit 1; }
