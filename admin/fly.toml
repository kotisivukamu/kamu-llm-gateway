app = "llm-proxy-admin"
primary_region = "arn"
kill_signal = "SIGTERM"
kill_timeout = "15s"

[deploy]
  strategy = "bluegreen"

[env]
  PORT = "8302"
  BASE_URL = "https://llm-proxy-admin.fly.dev"

[http_service]
  internal_port = 8302
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  # Deliberately 1, not the proxy's HA posture: this is a low-traffic internal
  # admin tool, not a hot-path service, and a single machine keeps better-auth
  # session cookies simple (no cross-instance session-store concern to reason
  # about at this size).
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[restart]]
  policy = "always"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
