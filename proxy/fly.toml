app = "kamu-llm-gateway-proxy"
primary_region = "arn"
kill_signal = "SIGTERM"
kill_timeout = "15s"

# One machine per region (arn + fra), each with its own proxy_data volume.
# Not bluegreen: Fly doesn't support bluegreen with volumes. Rolling replaces
# one machine at a time, so the other region keeps serving during a deploy.
[deploy]
  strategy = "rolling"

[env]
  PORT = "8301"
  # Each machine's usage buffer, on its own volume so it survives restarts.
  # The file carries a random store_id; api's poller keys llm.usage_log on
  # (store_id, row id) and keeps a cursor per store, so several machines are
  # fine. Budgets are not in this file (llm.key_spend in Postgres).
  DB_PATH = "/data/llm-proxy.db"
  # KamuStatus telemetry. Both values are non-secret by design: the ingest key
  # is a public write-only DSN-style key (the browser SDK puts it in page
  # source), and a heartbeat token only lets someone fake an "up" signal.
  KAMUSTATUS_INGEST_URL = "https://kamustatus-ingest.fly.dev"
  KAMUSTATUS_INGEST_KEY = "ksts_ef6c7507108d4236828c7eaa3c094665aa62935a25294a7f9eaa88224fc3d998"

# Secrets (Doppler -> Fly secrets, never in this file): GATEWAY_DATABASE_URL,
# ED25519_PUBLIC_KEY, ED25519_KEY_ID, CONTROL_PLANE_POLL_TOKEN and one key per
# upstream provider: ANTHROPIC_API_KEY, OPENAI_API_KEY, DEEPSEEK_API_KEY,
# MOONSHOT_API_KEY, CORTECS_API_KEY, TENSORX_API_KEY, GEMINI_API_KEY,
# JEV_API_KEY. A provider whose key is unset answers 502 provider_key_missing.

[mounts]
  source = "proxy_data"
  destination = "/data"
  initial_size = "1gb"

[http_service]
  internal_port = 8301
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[restart]]
  policy = "always"

# 512 MB: at 256 MB a statement leak (fixed in 3961b53) OOM-killed the
# machine every ~7 h, and the fixed process still settles around 140 MB RSS.
[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
